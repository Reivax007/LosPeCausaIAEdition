version: '3.8'

services:
  # ─── BASE DE DATOS (PostgreSQL) ────────────────
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: agrocompliance_db
      POSTGRES_USER: agro_user
      POSTGRES_PASSWORD: agro_password_segura
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  # ─── SPRING BOOT BACKEND ───────────────────────
  spring-boot:
    build: . # Asume que tu Dockerfile de Spring Boot está en la misma carpeta
    restart: always
    environment:
      # Aquí solucionamos el error: Conectamos Spring Boot con Postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agrocompliance_db
      - SPRING_DATASOURCE_USERNAME=agro_user
      - SPRING_DATASOURCE_PASSWORD=agro_password_segura
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - postgres

  # ─── N8N (Automatización) ──────────────────────
  n8n:
    image: n8nio/n8n
    restart: always
    environment:
      - GENERIC_TIMEZONE=America/La_Paz # Ajustado a tu zona horaria
      - N8N_PATH=/n8n/
      - WEBHOOK_URL=https://tudominio.com/n8n/
    volumes:
      - n8n_data:/home/node/.n8n
      - files_data:/files # Para leer/escribir PDFs o documentos legales
    networks:
      - n8n-network

  # ─── NGINX (Proxy Inverso y Frontend) ──────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro # Tu React/Frontend ya compilado
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - frontend-network
      - backend-network
      - n8n-network
    depends_on:
      - spring-boot
      - n8n
    restart: always

  # ─── CERTBOT (Certificados SSL) ────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot
                        --webroot-path=/var/www/certbot
                        --quiet;
          sleep 12h &
          wait $${!};
        done
      "
    restart: always

# ─── VOLÚMENES Y REDES ───────────────────────────
volumes:
  postgres_data:
  n8n_data:
  files_data:
  certbot-certs:
  certbot-www:

networks:
  frontend-network:
  backend-network:
  n8n-network: