services:
  # ─── BASE DE DATOS (PostgreSQL) ────────────────
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  # ─── SPRING BOOT BACKEND ───────────────────────
  spring-boot:
    build: .
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - postgres

  # ─── N8N (Automatización) ──────────────────────
  n8n:
    image: n8nio/n8n
    restart: always
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE}
      - N8N_PATH=/n8n/
      - WEBHOOK_URL=http://${DOMAIN_NAME}/n8n/
    volumes:
      - n8n_data:/home/node/.n8n
      - files_data:/files
    networks:
      - n8n-network

  # ─── NGINX (Proxy Inverso y Frontend) ──────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      # Pasamos la variable del .env hacia adentro del contenedor
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      # Montamos el archivo como plantilla para que Nginx inyecte la variable
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    networks:
      - frontend-network
      - backend-network
      - n8n-network
    depends_on:
      - spring-boot
      - n8n
    restart: always

# ─── VOLÚMENES Y REDES ───────────────────────────
volumes:
  postgres_data:
  n8n_data:
  files_data:

networks:
  frontend-network:
  backend-network:
  n8n-network: